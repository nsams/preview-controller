name: e2e

on:
    push:
    pull_request:

jobs:
    e2e:
        # Comes with a running docker daemon, docker compose and buildx.
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: docker version && docker compose version
            # Once up front, so that the parallel builds of the first tests do not all pull it.
            - run: docker pull node:24-alpine
            - run: npm run test:e2e
              env:
                  CI: "true"
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
