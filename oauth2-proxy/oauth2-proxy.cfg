# oauth2-proxy for the preview controller. It proxies nothing: the controller asks
# /__oauth2/auth for every request it gets, on every host, and passes /__oauth2/* on to it - see
# "Authentication" in the readme. What depends on the deployment (domain, provider, secrets) is
# set in .env, see .env.tpl.

http_address = "0.0.0.0:4180"

# Has to match oauth2ProxyPrefix in src/auth.ts. Not /oauth2, which the previews may need.
proxy_prefix = "/__oauth2"

# Straight to the provider, there is only one.
skip_provider_button = true

# Who may sign in is up to the provider settings in .env (e.g. a GitHub organization).
email_domains = ["*"]

# As long as the password sessions lasted. Lax, so that the cookie also goes along to previews
# opened in an iframe of another preview, which are all the same site.
cookie_expire = "168h"
cookie_samesite = "lax"
cookie_httponly = true
