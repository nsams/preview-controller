services:
    web:
        build: .
        environment:
            PORT: "3000"
        ports:
            - "127.0.0.1:${PREVIEW_PORT}:3000"
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/__health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 1s
            retries: 30
